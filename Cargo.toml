[package]
name = "spreet"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
calamine = "0.35.0"
serde = "1.0.228"
serde_bytes = "0.11.19"
ciborium = "0.2.2"
chrono = "0.4.44"
umya-spreadsheet = { version = "2.3.3", features = ["js"] }
spreadsheet-ods = "1.0.4"
infer = { version = "0.19.0", default-features = false }
wasm-minimal-protocol = { git = "https://github.com/astrale-sharp/wasm-minimal-protocol" }
indexmap = { version = "2.14.0", features = ["serde"] }
